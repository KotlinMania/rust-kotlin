primitiveByteSwapTemplates:
  I8: "{v}"
  U8: "{v}"
  U16: "((((({v}).toUInt() and 0xFFu) shl 8) or ((({v}).toUInt() shr 8) and 0xFFu)).toUShort())"
  I16: "((((({v}).toInt() and 0xFF) shl 8) or ((({v}).toInt() ushr 8) and 0xFF)).toShort())"
  U32: "(((({v}) shl 24)) or ((({v}) and 0x0000FF00u) shl 8) or ((({v}) shr 8) and 0x0000FF00u) or (({v}) shr 24))"
  I32: "(((({v}) shl 24)) or ((({v}) and 0x0000FF00) shl 8) or ((({v}) ushr 8) and 0x0000FF00) or (({v}) ushr 24))"
  U64: "(((({v}) shl 56)) or ((({v}) and 0x000000000000FF00uL) shl 40) or ((({v}) and 0x0000000000FF0000uL) shl 24) or ((({v}) and 0x00000000FF000000uL) shl 8) or (((({v}) shr 8) and 0x00000000FF000000uL)) or (((({v}) shr 24) and 0x0000000000FF0000uL)) or (((({v}) shr 40) and 0x000000000000FF00uL)) or (({v}) shr 56))"
  I64: "((((({v}).toULong() shl 56)) or ((({v}).toULong() and 0x000000000000FF00uL) shl 40) or ((({v}).toULong() and 0x0000000000FF0000uL) shl 24) or ((({v}).toULong() and 0x00000000FF000000uL) shl 8) or (((({v}).toULong() shr 8) and 0x00000000FF000000uL)) or (((({v}).toULong() shr 24) and 0x0000000000FF0000uL)) or (((({v}).toULong() shr 40) and 0x000000000000FF00uL)) or (({v}).toULong() shr 56)).toLong())"

floatToBitsTemplates:
  F16: "{recv}.toBits()"
  F32: "{recv}.toRawBits().toUInt()"
  F64: "{recv}.toRawBits().toULong()"
  F128: "{recv}.toBits()"

floatFromBitsSpecs:
  - { kind: F16, renderExpectKind: U16, castKind: U16, owner: F16 }
  - { kind: F32, renderExpectKind: U32, castKind: I32, owner: "{f32Type}" }
  - { kind: F64, renderExpectKind: U64, castKind: I64, owner: Double }
  - { kind: F128, renderExpectKind: U128, castKind: U128, owner: F128 }

# ==============================================================================
# Declarative Method-Call Pattern-Match & Template-Replacement Rules
# ==============================================================================

methodCallPatternRules:
  # --- Raw pointer (`ConstPtr<T>` / `MutPtr<T>`) method replacements ---
  - receiver: rawPtr
    match: "is_null"
    arity: 0
    replace: "(({recv}).rawAddress == 0L)"

  - receiver: rawPtr
    match: "cast_mut"
    arity: 0
    noTurbofish: true
    imports: ["{coreNs}.ptr.MutPtr"]
    replace: "MutPtr<{pointee}>(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "cast_const"
    arity: 0
    noTurbofish: true
    imports: ["{coreNs}.ptr.ConstPtr"]
    replace: "ConstPtr<{pointee}>(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "read read_unaligned"
    arity: 0
    noTurbofish: true
    replace: "({pointeeLayout}).readNative(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "read_volatile"
    arity: 0
    noTurbofish: true
    replace: "({pointeeLayout}).readVolatileNative(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "write write_unaligned"
    arity: 1
    noTurbofish: true
    replace: "({pointeeLayout}).writeNative(({recv}).rawAddress, {arg0})"

  - receiver: rawPtr
    match: "write_volatile"
    arity: 1
    noTurbofish: true
    replace: "({pointeeLayout}).writeVolatileNative(({recv}).rawAddress, {arg0})"

  - receiver: rawPtr
    match: "copy_to"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopy"]
    replace: "kmCopy(({recv}).rawAddress, ({arg0}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "copy_to_nonoverlapping"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopyNonoverlapping"]
    replace: "kmCopyNonoverlapping(({recv}).rawAddress, ({arg0}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "copy_from"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopy"]
    replace: "kmCopy(({arg0}).rawAddress, ({recv}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "copy_from_nonoverlapping"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopyNonoverlapping"]
    replace: "kmCopyNonoverlapping(({arg0}).rawAddress, ({recv}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "write_bytes"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmWriteBytes"]
    replace: "kmWriteBytes(({recv}).rawAddress, ({arg0}).toUByte(), ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "offset_from"
    arity: 1
    noTurbofish: true
    replace: "((({recv}).rawAddress - ({arg0}).rawAddress) / ({pointeeLayout}).strideBytes).toInt()"
    rawAbiReplace: "((({recv}).rawAddress - ({arg0}).rawAddress) / ({pointeeLayout}).strideBytes)"

  - receiver: rawPtr
    match: "addr"
    arity: 0
    noTurbofish: true
    replace: "({recv}).rawAddress.toInt()"
    rawAbiReplace: "({recv}).rawAddress.toULong()"

  - receiver: rawPtr
    match: "with_addr"
    arity: 1
    noTurbofish: true
    imports: ["{coreNs}.ptr.{ptrCtor}"]
    replace: "{ptrCtor}(({arg0}).toLong())"

  # --- Pre-argument phase (`phase: preArg`): rawAbi pointer shorthands, bit-counts, collection state, Option & Vec/Deque adapters ---
  - { phase: preArg, match: "is_null", arity: 0, requireRawAbi: true, replace: "({recv} == 0L)" }
  - { phase: preArg, match: "cast_mut cast_const", arity: 0, noTurbofish: true, requireRawAbi: true, replace: "{recv}" }
  - { phase: preArg, match: "cast", arity: 0, requireRawAbi: true, replace: "{recv}" }

  - phase: preArg
    receiver: intNumeric
    match: "count_ones"
    arity: 0
    noTurbofish: true
    requireCore: true
    imports: ["{coreNs}.num.countOnes"]
    replace: "{recvAtom}.countOnes()"

  - { phase: preArg, receiver: intNumeric, match: "count_ones", arity: 0, noTurbofish: true, replace: "{recvAtom}.countOneBits().toUInt()" }

  - { phase: preArg, receiver: stringLikeOrRefCell, match: "len", arity: 0, noTurbofish: true, replace: "{derefRecv}.length" }
  - { phase: preArg, receiver: sizedCollectionOrRefCell, match: "len", arity: 0, noTurbofish: true, replace: "{derefRecv}.size" }
  - { phase: preArg, receiver: arrayElemKind, match: "len", arity: 0, noTurbofish: true, replace: "{recv}.size" }
  - { phase: preArg, receiver: refCellGuard, match: "is_empty", arity: 0, noTurbofish: true, replace: "{recvAtom}.value.isEmpty()" }

  - phase: preArg
    receiver: stringBytesOrUninferred
    match: "as_bytes"
    arity: 0
    noTurbofish: true
    rawOrFinalReplace: "{derefRecv}.encodeToByteArray().asUByteArray()"
    replace: "{derefRecv}.encodeToByteArray().map {{ it.toUByte() }}"

  - { phase: preArg, receiver: refCellString, match: "as_str", arity: 0, noTurbofish: true, replace: "{recvAtom}.value" }
  - { phase: preArg, receiver: plainStringOrUnboundAsStr, match: "as_str", arity: 0, noTurbofish: true, replace: "{recv}" }
  - { phase: preArg, receiver: intoSubstOrStrOrList, match: "as_ref borrow", arity: 0, noTurbofish: true, replace: "{recv}" }
  - { phase: preArg, receiver: threadCurrent, match: "id", arity: 0, sideEffect: "usesCurrentThreadToken", replace: "currentThreadBoundToken()" }

  - { phase: preArg, receiver: potentialOption, match: "is_none", arity: 0, replace: "{recv} == null" }
  - { phase: preArg, receiver: potentialOption, match: "is_some", arity: 0, replace: "{recv} != null" }
  - { phase: preArg, receiver: nullableOption, match: "as_deref as_deref_mut as_ref as_mut", arity: 0, noTurbofish: true, replace: "{recv}" }

  - phase: preArg
    receiver: fmtOrQueue
    match: "debug_list"
    arity: 0
    replace: "object {{ val entries = mutableListOf<Any?>(); fun entry(v: Any?) = apply {{ entries.add(v) }}; fun entries(iter: Iterable<*>) = apply {{ for (e in iter) entries.add(e) }}; fun finish() {{ {recv}.append(entries.joinToString(\", \", \"[\", \"]\")) }} }}"

  - phase: preArg
    receiver: fmtOrQueue
    match: "debug_set"
    arity: 0
    replace: "object {{ val entries = mutableListOf<Any?>(); fun entry(v: Any?) = apply {{ entries.add(v) }}; fun entries(iter: Iterable<*>) = apply {{ for (e in iter) entries.add(e) }}; fun finish() {{ {recv}.append(entries.joinToString(\", \", \"{{\", \"}}\")) }} }}"

  - phase: preArg
    receiver: fmtOrQueue
    match: "debug_map"
    arity: 0
    replace: "object {{ val entries = mutableListOf<String>(); fun entry(k: Any?, v: Any?) = apply {{ entries.add(\"$k: $v\") }}; fun finish() {{ {recv}.append(entries.joinToString(\", \", \"{{\", \"}}\")) }} }}"

  - { phase: preArg, receiver: fmtOrQueue, match: "pop_front", arity: 0, replace: "{recv}.removeFirstOrNull()" }
  - { phase: preArg, receiver: dequeIter, match: "next", arity: 0, noTurbofish: true, replace: "{recv}.removeFirstOrNull()" }
  - { phase: preArg, receiver: dequeIter, match: "next_back", arity: 0, noTurbofish: true, replace: "{recv}.removeLastOrNull()" }
  - { phase: preArg, receiver: dequeIter, match: "len", arity: 0, noTurbofish: true, replace: "{recv}.size" }
  - { phase: preArg, receiver: dequeIter, match: "clone", arity: 0, noTurbofish: true, replace: "ArrayDeque({recv})" }
  - { phase: preArg, receiver: vec, match: "pop", arity: 0, noTurbofish: true, replace: "{recv}.removeLastOrNull()" }
  - { phase: preArg, receiver: vec, match: "len", arity: 0, noTurbofish: true, replace: "{recv}.size" }
  - { phase: preArg, receiver: vec, match: "into_iter iter iter_mut", arity: 0, noTurbofish: true, replace: "ArrayDeque({recv})" }
  - { phase: preArg, receiver: vec, match: "clone", arity: 0, noTurbofish: true, replace: "{recv}.toMutableList()" }
  - { phase: preArg, receiver: vec, match: "last_mut", arity: 0, noTurbofish: true, replace: "{recv}.lastOrNull()" }
  - { phase: preArg, receiver: vec, match: "first_mut", arity: 0, noTurbofish: true, replace: "{recv}.firstOrNull()" }
  - { phase: preArg, receiver: intoSubstParam, match: "into", arity: 0, noTurbofish: true, replace: "{recv}" }
  - { phase: preArg, receiver: sharedBorrowRecv, match: "into_token_stream", arity: 0, noTurbofish: true, replace: "TokenStream.new().also {{ tokens -> {recvAtom}.toTokens(tokens) }}" }

  # --- Post-argument phase (`phase: postArg`): unified predicate-driven method lowering ---
  - receiver: stringOrCharSeq
    match: "chars"
    arity: 0
    noTurbofish: true
    requireCore: true
    unlessDeclaredTopFns: "chars"
    unlessAnyInstanceMethod: "chars"
    unlessSelfRecursive: "{coreNs}.str#chars"
    imports: ["{coreNs}.str.chars"]
    replace: "{recvAtom}.chars()"

  - receiver: charOrCharLit
    match: "to_digit"
    arity: 1
    noTurbofish: true
    requireCore: true
    unlessSelfRecursive: "{coreNs}.char.methods#toDigit"
    imports: ["{coreNs}.char.methods.toDigit"]
    replace: "{recvAtom}.toDigit({arg0U32})"

  - { receiver: stringOrStrLit, match: "fmt", arity: 1, noTurbofish: true, argGuard: arg0FmtBuilder, replace: "{arg0}.append({recv})" }
  - { receiver: refCellString, match: "clear", arity: 0, noTurbofish: true, replace: "{recvAtom}.value = \"\"" }
  - { receiver: assignableStringPath, match: "clear", arity: 0, noTurbofish: true, replace: "{recv} = \"\"" }

  - { receiver: charsIter, match: "next", arity: 0, noTurbofish: true, replace: "{recvAtom}.next()" }
  - { receiver: charsIter, match: "as_str", arity: 0, noTurbofish: true, replace: "{recvAtom}.asStr()" }
  - { receiver: charsIter, match: "clone", arity: 0, noTurbofish: true, replace: "{recvAtom}.clone()" }
  - { receiver: charsIter, match: "enumerate", arity: 0, noTurbofish: true, replace: "{recvAtom}.enumerate()" }

  - { receiver: fmtBuilder, match: "write_str write_char pad write_fmt", arity: 1, noTurbofish: true, replace: "{recv}.append({arg0})" }

  - { receiver: any, match: "append_all", arity: 1, noTurbofish: true, replace: "for (item in {arg0}) item.toTokens({recv})" }
  - { receiver: any, match: "find", arity: 1, noTurbofish: true, replace: "{recv}.indexOf({arg0}).takeIf {{ it >= 0 }}" }
  - { receiver: any, match: "position", arity: 1, noTurbofish: true, replace: "{recvAtom}.indexOfFirst({arg0}).takeIf {{ it >= 0 }}" }
  - { receiver: any, match: "rposition", arity: 1, noTurbofish: true, replace: "{recvAtom}.indexOfLast({arg0}).takeIf {{ it >= 0 }}" }
  - { receiver: any, match: "enumerate", arity: 0, noTurbofish: true, replace: "{recvAtom}.mapIndexed {{ index, item -> Pair(index, item) }}" }
  - { receiver: any, match: "debug_struct", arity: 1, noTurbofish: true, unlessDeclaredTypes: "DebugStruct", replace: "DebugStruct({recv}, {arg0})" }
  - { receiver: any, match: "debug_tuple", arity: 1, noTurbofish: true, unlessDeclaredTypes: "DebugTuple", replace: "DebugTuple({recv}, {arg0})" }
  - { receiver: any, match: "push_back", arity: 1, noTurbofish: true, replace: "{recv}.addLast({arg0})" }
  - { receiver: vecOrMutableList, match: "extend_from_slice", arity: 1, noTurbofish: true, replace: "{recv}.addAll({arg0})" }

  - { receiver: vec, match: "push", arity: 1, noTurbofish: true, replace: "{recv}.add({arg0})" }
  - { receiver: vec, match: "insert", arity: 2, noTurbofish: true, replace: "{recv}.add({arg0}, {arg1})" }
  - { receiver: vec, match: "clone_from", arity: 1, noTurbofish: true, replace: "run {{ {recv}.clear(); {recv}.addAll({arg0}) }}" }
  - { receiver: map, match: "insert", arity: 2, noTurbofish: true, replace: "{recvAtom}.put({arg0}, {arg1})" }
  - { receiver: map, match: "clone", arity: 0, noTurbofish: true, replace: "{recvAtom}.toMutableMap()" }
  - { receiver: map, match: "get get_mut", arity: 1, noTurbofish: true, replace: "{recvAtom}.get({arg0})" }
  - { receiver: set, match: "clone", arity: 0, noTurbofish: true, replace: "{recvAtom}.toMutableSet()" }
  - { receiver: vec, match: "get get_mut", arity: 1, noTurbofish: true, argGuard: nonRangeArg0, replace: "{recv}.getOrNull({idx0})" }
  - { receiver: indexedSliceOrArray, match: "get get_mut", arity: 1, noTurbofish: true, argGuard: nonRangeArg0, replace: "{recvAtom}.getOrNull({idx0})" }
  - { receiver: set, match: "insert", minArity: 1, maxArity: 2, noTurbofish: true, argGuard: setInsertArgs, replace: "{recvAtom}.add({arg0})" }
  - { receiver: nonVecFieldOrNullableLocal, match: "clone_from", arity: 1, noTurbofish: true, replace: "{recv} = {arg0}" }

  - { receiver: stringOrUninferred, match: "strip_prefix", arity: 1, noTurbofish: true, replace: "{recvAtom}.takeIf {{ it.startsWith({arg0}) }}?.removePrefix({arg0})" }
  - { receiver: stringOrUninferred, match: "strip_suffix", arity: 1, noTurbofish: true, replace: "{recvAtom}.takeIf {{ it.endsWith({arg0}) }}?.removeSuffix({arg0})" }

  - receiver: stringSplitRecv
    match: "split_once"
    arity: 1
    noTurbofish: true
    argGuard: charPatArg0
