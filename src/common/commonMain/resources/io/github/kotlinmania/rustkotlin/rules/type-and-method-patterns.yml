floatAdditionalSameTypeReturnMethods: "powf powi min max fract mul_add recip to_degrees to_radians signum log"

# ==============================================================================
# Declarative Method-Call Pattern-Match & Template-Replacement Rules
# ==============================================================================

methodCallPatternRules:
  # --- Raw pointer (`ConstPtr<T>` / `MutPtr<T>`) method replacements ---
  - receiver: rawPtr
    match: "is_null"
    arity: 0
    replace: "(({recv}).rawAddress == 0L)"

  - receiver: rawPtr
    match: "cast_mut"
    arity: 0
    noTurbofish: true
    imports: ["{coreNs}.ptr.MutPtr"]
    replace: "MutPtr<{pointee}>(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "cast_const"
    arity: 0
    noTurbofish: true
    imports: ["{coreNs}.ptr.ConstPtr"]
    replace: "ConstPtr<{pointee}>(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "read read_unaligned"
    arity: 0
    noTurbofish: true
    replace: "({pointeeLayout}).readNative(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "read_volatile"
    arity: 0
    noTurbofish: true
    replace: "({pointeeLayout}).readVolatileNative(({recv}).rawAddress)"

  - receiver: rawPtr
    match: "write write_unaligned"
    arity: 1
    noTurbofish: true
    replace: "({pointeeLayout}).writeNative(({recv}).rawAddress, {arg0})"

  - receiver: rawPtr
    match: "write_volatile"
    arity: 1
    noTurbofish: true
    replace: "({pointeeLayout}).writeVolatileNative(({recv}).rawAddress, {arg0})"

  - receiver: rawPtr
    match: "copy_to"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopy"]
    replace: "kmCopy(({recv}).rawAddress, ({arg0}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "copy_to_nonoverlapping"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopyNonoverlapping"]
    replace: "kmCopyNonoverlapping(({recv}).rawAddress, ({arg0}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "copy_from"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopy"]
    replace: "kmCopy(({arg0}).rawAddress, ({recv}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "copy_from_nonoverlapping"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmCopyNonoverlapping"]
    replace: "kmCopyNonoverlapping(({arg0}).rawAddress, ({recv}).rawAddress, ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "write_bytes"
    arity: 2
    noTurbofish: true
    imports: ["{coreNs}.intrinsics.kmWriteBytes"]
    replace: "kmWriteBytes(({recv}).rawAddress, ({arg0}).toUByte(), ({arg1}).toLong() * ({pointeeLayout}).sizeBytes)"

  - receiver: rawPtr
    match: "offset_from"
    arity: 1
    noTurbofish: true
    replace: "((({recv}).rawAddress - ({arg0}).rawAddress) / ({pointeeLayout}).strideBytes).toInt()"
    rawAbiReplace: "((({recv}).rawAddress - ({arg0}).rawAddress) / ({pointeeLayout}).strideBytes)"

  - receiver: rawPtr
    match: "addr"
    arity: 0
    noTurbofish: true
    replace: "({recv}).rawAddress.toInt()"
    rawAbiReplace: "({recv}).rawAddress.toULong()"

  - receiver: rawPtr
    match: "with_addr"
    arity: 1
    noTurbofish: true
    imports: ["{coreNs}.ptr.{ptrCtor}"]
    replace: "{ptrCtor}(({arg0}).toLong())"

  # --- Formatter debug builder & VecDeque / Vec / ArrayDeque adapter methods ---
  - receiver: fmtOrQueue
    match: "debug_list"
    arity: 0
    replace: "object {{ val entries = mutableListOf<Any?>(); fun entry(v: Any?) = apply {{ entries.add(v) }}; fun entries(iter: Iterable<*>) = apply {{ for (e in iter) entries.add(e) }}; fun finish() {{ {recv}.append(entries.joinToString(\", \", \"[\", \"]\")) }} }}"

  - receiver: fmtOrQueue
    match: "debug_set"
    arity: 0
    replace: "object {{ val entries = mutableListOf<Any?>(); fun entry(v: Any?) = apply {{ entries.add(v) }}; fun entries(iter: Iterable<*>) = apply {{ for (e in iter) entries.add(e) }}; fun finish() {{ {recv}.append(entries.joinToString(\", \", \"{{\", \"}}\")) }} }}"

  - receiver: fmtOrQueue
    match: "debug_map"
    arity: 0
    replace: "object {{ val entries = mutableListOf<String>(); fun entry(k: Any?, v: Any?) = apply {{ entries.add(\"$k: $v\") }}; fun finish() {{ {recv}.append(entries.joinToString(\", \", \"{{\", \"}}\")) }} }}"

  - receiver: fmtOrQueue
    match: "pop_front"
    arity: 0
    replace: "{recv}.removeFirstOrNull()"

  - receiver: dequeIter
    match: "next"
    arity: 0
    noTurbofish: true
    replace: "{recv}.removeFirstOrNull()"

  - receiver: dequeIter
    match: "next_back"
    arity: 0
    noTurbofish: true
    replace: "{recv}.removeLastOrNull()"

  - receiver: dequeIter
    match: "len"
    arity: 0
    noTurbofish: true
    replace: "{recv}.size"

  - receiver: dequeIter
    match: "clone"
    arity: 0
    noTurbofish: true
    replace: "ArrayDeque({recv})"

  - receiver: vec
    match: "pop"
    arity: 0
    noTurbofish: true
    replace: "{recv}.removeLastOrNull()"

  - receiver: vec
    match: "len"
    arity: 0
    noTurbofish: true
    replace: "{recv}.size"

  - receiver: vec
    match: "into_iter iter iter_mut"
    arity: 0
    noTurbofish: true
    replace: "ArrayDeque({recv})"

  - receiver: vec
    match: "clone"
    arity: 0
    noTurbofish: true
    replace: "{recv}.toMutableList()"

  - receiver: vec
    match: "last_mut"
    arity: 0
    noTurbofish: true
    replace: "{recv}.lastOrNull()"

  - receiver: vec
    match: "first_mut"
    arity: 0
    noTurbofish: true
    replace: "{recv}.firstOrNull()"
