  checked_rem_euclid: checkedRemEuclid
  wrapping_add: wrappingAdd
  wrapping_sub: wrappingSub
  wrapping_mul: wrappingMul
  wrapping_div: wrappingDiv
  wrapping_rem: wrappingRem
  saturating_add: saturatingAdd
