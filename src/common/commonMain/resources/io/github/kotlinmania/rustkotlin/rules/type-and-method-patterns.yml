# ==============================================================================
# Declarative Free & Associated Function Call Pattern/Replacement Rules
# ==============================================================================

calleePatternRules:
  # --- Pre-callee raw path rules (evaluated before rendering generic callee path) ---
  - phase: preCallee
    matchSuffix: "debug_simd_finish"
    minArity: 3
    maxArity: 4
    unlessDeclaredTopFns: "debug_simd_finish"
    calleeGuard: taggedCoreResult
    replace: "run {{ val simdDbgArr = {rawArg2}; ({rawArg0}).append({rawArg1}); {resName}.Ok<Unit, {fmtErr}>(Unit) }}"

  - phase: preCallee
    matchSuffix: "Write.write_fmt"
    arity: 2
    unlessDeclaredTypes: "Write"
    calleeGuard: fmtStringBuilderArg0
    replace: "{neutralAtom0}.append({neutralArg1})"

  - phase: preCallee
    matchSuffix: "Write.write_fmt"
    arity: 2
    unlessDeclaredTypes: "Write"
    replace: "{neutralAtom0}.writeFmt({neutralArg1})"

  # --- Post-callee rendered function/associated call rules ---
  - match: "null nullMut null_mut nullVal"
    matchSuffix: "ptr.null ptr.nullMut ptr.null_mut nullVal"
    arity: 0
    unlessDeclaredTopFns: "null null_mut"
    imports: ["{coreNs}.ptr.{nullPtrCtor}"]
    rawAbiImports: []
    rawAbiReplace: "0L"
    replace: "{nullPtrCtor}{turbofish}(0L)"

  - { match: "drop", matchSuffix: "mem.drop", arity: 1, unlessDeclaredTopFns: "drop", replace: "({arg0}).let {{ }}" }
  - { matchSuffix: "TypeId.of RustTypeId.of", arity: 0, replace: "RustTypeId.of{turbofish}()" }
  - { match: "Cow.Borrowed Cow.Owned", matchSuffix: "Cow.Borrowed Cow.Owned", arity: 1, unlessDeclaredTypes: "Cow", replace: "{arg0}" }
  - { match: "Box.new", matchOnBase: false, arity: 1, unlessDeclaredTypes: "Box", replace: "{arg0}" }
  - { match: "Rc.new", matchOnBase: false, arity: 1, unlessDeclaredTypes: "Rc", replace: "{arg0}" }
  - { match: "Arc.new", matchOnBase: false, arity: 1, unlessDeclaredTypes: "Arc", replace: "{arg0}" }
  - { match: "NoDrop.new", matchOnBase: false, arity: 1, unlessDeclaredTypes: "NoDrop", replace: "{arg0}" }
  - { match: "ManuallyDrop.new", matchOnBase: false, arity: 1, unlessDeclaredTypes: "ManuallyDrop", replace: "{arg0}" }
  - { matchSuffix: "Arc.clone", arity: 1, unlessDeclaredTypes: "Arc", calleeGuard: noCalleeTypeArgs, replace: "{derefRefArg0}" }
  - { matchSuffix: "Rc.clone", arity: 1, unlessDeclaredTypes: "Rc", calleeGuard: noCalleeTypeArgs, replace: "{derefRefArg0}" }
  - { match: "Vec.new", matchOnBase: false, arity: 0, unlessDeclaredTypes: "Vec", replace: "mutableListOf()" }
  - { match: "Vec.withCapacity", matchOnBase: false, arity: 1, unlessDeclaredTypes: "Vec", replace: "ArrayList({arg0})" }
  - { match: "Vec.from", matchOnBase: false, arity: 1, unlessDeclaredTypes: "Vec", replace: "{arg0}.toMutableList()" }
  - { match: "VecDeque.from", matchOnBase: false, arity: 1, unlessDeclaredTypes: "VecDeque", replace: "ArrayDeque({arg0})" }
  - { match: "String.new String.withCapacity", matchSuffix: "String.new String.withCapacity", maxArity: 1, unlessDeclaredTypes: "String", replace: "\"\"" }
  - { match: "String.from", arity: 1, unlessDeclaredTypes: "String", calleeGuard: strArg0, replace: "{arg0}" }
  - { match: "String.from", arity: 1, unlessDeclaredTypes: "String", replace: "({arg0}).toString()" }
  - { match: "HashMap.new BTreeMap.new HashMap.withCapacity BTreeMap.withCapacity", maxArity: 1, unlessDeclaredTypes: "HashMap BTreeMap", replace: "mutableMapOf{turbofish}()" }
  - { match: "HashSet.new BTreeSet.new HashSet.withCapacity BTreeSet.withCapacity", maxArity: 1, unlessDeclaredTypes: "HashSet BTreeSet", replace: "mutableSetOf{turbofish}()" }
  - { match: "empty iter.empty", matchOnBase: false, arity: 0, unlessTopSignatures: "empty", replace: "ArrayDeque()" }
  - { match: "once", matchSuffix: "iter.once", arity: 1, unlessTopSignatures: "once", unlessDeclaredTopFns: "once", replace: "listOf{turbofish}({arg0})" }
  - { match: "min cmp.min", matchOnBase: false, arity: 2, unlessDeclaredTopFns: "min", replace: "minOf({arg0}, {arg1})" }

  # Raw slice views, `MaybeUninit`, `ptr::from_ref`/`from_mut`, and `any::type_name`
  - match: "fromRawParts from_raw_parts"
    matchSuffix: "slice.fromRawParts slice.from_raw_parts"
    arity: 2
    calleeGuard: coreActive
    imports: ["{coreNs}.mem.linearSliceView"]
    replace: "linearSliceView({arg0}, {arg1I32}, {arg0PointeeLayout})"

  - match: "fromRawPartsMut from_raw_parts_mut"
    matchSuffix: "slice.fromRawPartsMut slice.from_raw_parts_mut"
    arity: 2
    calleeGuard: coreActive
    imports: ["{coreNs}.mem.linearMutSliceView"]
    replace: "linearMutSliceView({arg0}, {arg1I32}, {arg0PointeeLayout})"

  - match: "fromRawParts from_raw_parts fromRawPartsMut from_raw_parts_mut"
    matchSuffix: "slice.fromRawParts slice.from_raw_parts slice.fromRawPartsMut slice.from_raw_parts_mut"
    arity: 2
    replace: "{callee}({arg0}, {arg1})"

  - matchSuffix: "MaybeUninit.zeroed"
    arity: 0
    imports: ["{coreNs}.mem.maybeuninit.MaybeUninit"]
    replace: "MaybeUninit.zeroed({maybeUninitCallLayout})"

  - matchSuffix: "MaybeUninit.uninit"
    arity: 0
    imports: ["{coreNs}.mem.maybeuninit.MaybeUninit"]
    replace: "MaybeUninit.uninit({maybeUninitCallLayout})"

  - matchSuffix: "MaybeUninit.new"
    arity: 1
    imports: ["{coreNs}.mem.maybeuninit.MaybeUninit"]
    replace: "MaybeUninit.new({arg0}, {maybeUninitArg0Layout})"

  - match: "fromRef from_ref fromMut from_mut"
    matchSuffix: "ptr.fromRef ptr.from_ref ptr.fromMut ptr.from_mut"
    arity: 1
    replace: "{arg0}"

  - match: "typeName type_name"
    matchSuffix: "any.typeName any.type_name"
    arity: 0
    replace: "{quotedSelfType}"

  # Formatting trait UFCS (`Display::fmt`, `Debug::fmt`, etc.), endian byte-swaps, and companion `min`/`max`
  - { arity: 2, calleeGuard: fmtTraitMethod, replace: "{arg1}.append(({arg0}).toString())" }

  - match:
      - "Byte.toLe Byte.fromLe Byte.toBe Byte.fromBe Byte.swapBytes"
      - "UByte.toLe UByte.fromLe UByte.toBe UByte.fromBe UByte.swapBytes"
      - "Short.toLe Short.fromLe UShort.toLe UShort.fromLe"
      - "Int.toLe Int.fromLe UInt.toLe UInt.fromLe"
      - "Long.toLe Long.fromLe ULong.toLe ULong.fromLe"
    matchOnBase: false
    arity: 1
    replace: "{arg0}"

  - { match: "Short.toBe Short.fromBe Short.swapBytes", matchOnBase: false, arity: 1, byteSwapKind: I16, replace: "{byteSwapArg0}" }
  - { match: "UShort.toBe UShort.fromBe UShort.swapBytes", matchOnBase: false, arity: 1, byteSwapKind: U16, replace: "{byteSwapArg0}" }
  - { match: "Int.toBe Int.fromBe Int.swapBytes", matchOnBase: false, arity: 1, byteSwapKind: I32, replace: "{byteSwapArg0}" }
  - { match: "UInt.toBe UInt.fromBe UInt.swapBytes", matchOnBase: false, arity: 1, byteSwapKind: U32, replace: "{byteSwapArg0}" }
  - { match: "Long.toBe Long.fromBe Long.swapBytes", matchOnBase: false, arity: 1, byteSwapKind: I64, replace: "{byteSwapArg0}" }
  - { match: "ULong.toBe ULong.fromBe ULong.swapBytes", matchOnBase: false, arity: 1, byteSwapKind: U64, replace: "{byteSwapArg0}" }

  - match: "Float.min kotlin.Float.min Double.min"
    matchOnBase: false
    arity: 2
    replace: "run {{ val lhsMin0 = ({arg0}); val rhsMin0 = ({arg1}); when {{ lhsMin0.isNaN() -> rhsMin0; rhsMin0.isNaN() -> lhsMin0; else -> minOf(lhsMin0, rhsMin0) }} }}"

  - match: "Float.max kotlin.Float.max Double.max"
    matchOnBase: false
    arity: 2
    replace: "run {{ val lhsMax0 = ({arg0}); val rhsMax0 = ({arg1}); when {{ lhsMax0.isNaN() -> rhsMax0; rhsMax0.isNaN() -> lhsMax0; else -> maxOf(lhsMax0, rhsMax0) }} }}"

  - match: "Byte.min UByte.min Short.min UShort.min Int.min UInt.min Long.min ULong.min"
    matchOnBase: false
    arity: 2
    replace: "minOf({arg0}, {arg1})"

  - match: "Byte.max UByte.max Short.max UShort.max Int.max UInt.max Long.max ULong.max"
    matchOnBase: false
    arity: 2
    replace: "maxOf({arg0}, {arg1})"

